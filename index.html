<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LEONOVA – English Trainer</title>
  <meta name="description" content="Lernspiel für die Englisch-Schularbeit: Adjectives &amp; Adverbs, Past Tenses, Linking Words, Vocabulary. Alles zum Selbst-Tippen.">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%23111'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='30' font-weight='700' text-anchor='middle' fill='%23fff'%3EL%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('leonova.theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* no storage – follow system */ }
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <button class="brand" data-act="home" aria-label="Zur Startseite">
      <span class="brand-mark">L</span>
      <span class="brand-text">LEONOVA<small>English Trainer</small></span>
    </button>
    <div class="topbar-right">
      <span class="pill-stat" id="xpTotal" title="Gesamt-XP">0 XP</span>
      <button class="icon-btn" id="themeBtn" data-act="theme" aria-label="Dark Mode umschalten" title="Dark Mode">◐</button>
    </div>
  </header>

  <main id="app" aria-live="polite">
    <noscript><p class="bubble">Bitte JavaScript aktivieren.</p></noscript>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-act="close-modal"></div>
    <div class="modal-card bubble-card" role="dialog" aria-modal="true" id="modalCard"></div>
  </div>
  <div id="toast" class="toast" role="status"></div>

  <script src="data/rules.js"></script>
  <script src="data/questions.js"></script>
  <script src="data/texts.js"></script>
  <script src="app.js"></script>
</body>
</html>
